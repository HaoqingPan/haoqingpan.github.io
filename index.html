<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haoqing (Justin) Pan · Toy & Industrial Design Portfolio</title>
<meta name="description" content="Portfolio of Haoqing (Justin) Pan: collectible toy and industrial design, game design and art.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%231d1d1b%22/%3E%3Ctext x=%2232%22 y=%2241%22 font-size=%2224%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%23ebebe8%22 text-anchor=%22middle%22%3EHP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-mode="industrial">

<header class="topbar">
  <a class="brand" href="#industrial" data-nav="home" aria-label="Home">
    <span class="badge">HP</span>
    <span class="brand-name" data-i18n="brandName">Haoqing (Justin) Pan</span>
  </a>
  <nav class="nav">
    <a href="#" data-nav="work" data-i18n="navWork">Work</a>
    <a href="#" data-nav="about" data-i18n="navAbout">About</a>
    <a href="#" data-nav="contact" data-i18n="navContact">Contact</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </nav>
</header>

<main id="home-view">
  <section class="hero">
    <p class="hello" data-i18n="hello">Hi, I'm</p>
    <h1 class="name" id="hero-name">Haoqing (Justin) Pan</h1>
    <div class="mode-switch" role="tablist" aria-label="Portfolio">
      <button type="button" role="tab" data-mode="industrial"></button>
      <button type="button" role="tab" data-mode="game"></button>
      <button type="button" role="tab" data-mode="art"></button>
    </div>
    <p class="tagline" id="tagline"></p>
  </section>

  <section id="work" class="work">
    <div class="grid" id="grid"></div>
  </section>

  <section id="about" class="about">
    <h2 class="section-title" data-i18n="aboutTitle">About me</h2>
    <div class="about-grid">
      <div class="about-text" id="about-text"></div>
      <div class="about-side">
        <h3 data-i18n="education">Education</h3>
        <ul class="edu" id="edu"></ul>
        <h3 data-i18n="skills">Skills</h3>
        <dl class="skills" id="skills"></dl>
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2 class="section-title" data-i18n="contactTitle">Contact me</h2>
    <p class="contact-lead" data-i18n="contactLead">Seen something you like? Leave me a message, or reach me directly.</p>
    <div class="contact-grid">
      <form class="msg" id="msg-form" novalidate>
        <label><span data-i18n="fName">Your name</span><input name="name" autocomplete="name"></label>
        <label><span data-i18n="fEmail">Your email</span><input name="email" type="email" autocomplete="email"></label>
        <label><span data-i18n="fMsg">Message</span><textarea name="message" rows="5"></textarea></label>
        <p class="form-err" id="form-err" role="alert"></p>
        <button type="submit" class="btn" data-i18n="fSend">Send message</button>
        <p class="form-note" data-i18n="fNote">This opens your email app with the message ready to send.</p>
      </form>
      <ul class="channels" id="channels"></ul>
    </div>
  </section>
</main>

<main id="project-view" hidden></main>

<footer class="footer">
  <p id="footer-copy"></p>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-close" aria-label="Close">×</button>
  <figure>
    <img alt="" draggable="false">
    <figcaption></figcaption>
  </figure>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
